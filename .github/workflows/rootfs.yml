name: rootfs

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct Apple CDN URL for iPhone X (iPhone10,3) 16.7.16 IPSW'
        default: 'https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw'
        required: true
      size:
        description: 'Target HFS+ size (e.g. 14G, 16G)'
        default: '14G'
        required: true

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install dependencies and build apfs-fuse
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs p7zip-full zstd rsync python3 cmake build-essential \
            libfuse3-dev fuse3 bzip2 libbz2-dev libattr1-dev curl
          echo "[*] Installing kernel filesystem modules..."
          sudo apt-get install -y linux-modules-extra-azure linux-modules-extra-$(uname -r) || true
          sudo modprobe hfsplus || true
          sudo modprobe loop || true
          lsmod | grep -E "hfs|loop" || true

          echo "[*] Cloning and compiling apfs-fuse..."
          git clone --recursive https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          mkdir -p /tmp/apfs-fuse/build
          cd /tmp/apfs-fuse/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo cp apfs-fuse /usr/local/bin/
          sudo cp apfs-fuse /usr/bin/
          sudo chmod +x /usr/local/bin/apfs-fuse /usr/bin/apfs-fuse
          apfs-fuse --help || true

      - name: Download IPSW and extract DMGs
        run: |
          URL="${{ inputs.ipsw_url }}"
          # Verify URL is alive; if 403 or stale, use verified Apple 2025FallFCS CDN link
          if ! curl -sfI "$URL" >/dev/null 2>&1; then
            echo "[!] Input URL is stale or 403. Using verified active Apple CDN link..."
            URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          fi
          echo "[*] Downloading IPSW from: $URL"
          curl -fSL -o restore.ipsw "$URL"

          echo "[*] Extracting BuildManifest.plist..."
          7z e -y restore.ipsw BuildManifest.plist

          python3 -c "
          import plistlib, sys
          with open('BuildManifest.plist', 'rb') as f:
              manifest = plistlib.load(f)
          os_dmg, sysos_dmg, appos_dmg = None, None, None
          for bi in manifest.get('BuildIdentities', []):
              m = bi.get('Manifest', {})
              if not os_dmg and 'OS' in m:
                  os_dmg = m['OS'].get('Info', {}).get('Path')
              if not sysos_dmg and 'Cryptex1,SystemOS' in m:
                  sysos_dmg = m['Cryptex1,SystemOS'].get('Info', {}).get('Path')
              if not appos_dmg and 'Cryptex1,AppOS' in m:
                  appos_dmg = m['Cryptex1,AppOS'].get('Info', {}).get('Path')
              if os_dmg and sysos_dmg and appos_dmg:
                  break
          if not (os_dmg and sysos_dmg and appos_dmg):
              print('Failed to identify required DMGs in BuildManifest.plist', file=sys.stderr)
              sys.exit(1)
          print(f'OS_DMG={os_dmg}')
          print(f'SYSOS_DMG={sysos_dmg}')
          print(f'APPOS_DMG={appos_dmg}')
          with open('dmg_names.env', 'w') as out:
              out.write(f'OS_DMG={os_dmg}\nSYSOS_DMG={sysos_dmg}\nAPPOS_DMG={appos_dmg}\n')
          "
          cat dmg_names.env
          source dmg_names.env

          echo "[*] Extracting ONLY required APFS DMGs ($OS_DMG, $SYSOS_DMG, $APPOS_DMG)..."
          7z e -y restore.ipsw "$OS_DMG" "$SYSOS_DMG" "$APPOS_DMG"
          rm -f restore.ipsw BuildManifest.plist
          ls -lh *.dmg

      - name: Assemble unified HFS+ image
        run: |
          source dmg_names.env
          echo "[*] OS DMG:     $OS_DMG"
          echo "[*] SystemOS:   $SYSOS_DMG"
          echo "[*] AppOS:      $APPOS_DMG"

          sudo modprobe hfsplus || true
          sudo modprobe loop || true

          echo "[*] Running mkiosroot.sh..."
          sudo bash -x tools/mkiosroot.sh "$OS_DMG" "$SYSOS_DMG" "$APPOS_DMG" ios16-root.img "${{ inputs.size }}" 2>&1 | tee /tmp/mkiosroot.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### ❌ mkiosroot.sh Failed (Exit Code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/mkiosroot.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi
          rm -f *.dmg dmg_names.env
          ls -lh ios16-root.img

      - name: Apply whyred root tweaks
        run: |
          echo "[*] Applying tweaks (skip setup, hactivation, watchdog bypass)..."
          sudo fsck.hfsplus -fy ios16-root.img || true
          mkdir -p mnt_ios
          sudo mount -t hfsplus -o loop,force ios16-root.img mnt_ios
          sudo python3 tools/whyred-root-tweaks.py mnt_ios
          sudo umount mnt_ios
          sudo fsck.hfsplus -fn ios16-root.img

      - name: Convert to Android Sparse Image
        run: |
          echo "[*] Converting to sparse image (img2simg.py)..."
          python3 tools/img2simg.py ios16-root.img ios16-root.simg
          rm -f ios16-root.img
          ls -lh ios16-root.simg

      - name: Compress with zstd
        run: |
          echo "[*] Compressing with zstd..."
          zstd -T0 -8 ios16-root.simg -o ios16-root.simg.zst
          rm -f ios16-root.simg
          ls -lh ios16-root.simg.zst

      - name: Split archive into < 2GB parts
        run: |
          mkdir -p out_rootfs
          split -b 1800M ios16-root.simg.zst out_rootfs/ios16-root.simg.zst.part_
          rm -f ios16-root.simg.zst
          ls -lh out_rootfs/

      - name: Upload Rootfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-whyred-rootfs
          path: out_rootfs/
          retention-days: 7
